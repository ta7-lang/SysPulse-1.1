name: Сборка SysPulse

# Работает в двух вариантах:
#  1) в репозитории лежит архив SysPulse.zip (не распакованный) — workflow распакует его сам;
#  2) в репозитории лежат распакованные исходники (main.py в корне).

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - name: Получение файлов репозитория
        uses: actions/checkout@v4

      - name: Поиск исходников (распаковка zip при необходимости)
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $main = Get-ChildItem -Path $root -Filter main.py -Recurse -File |
                  Where-Object { $_.FullName -notmatch '\\\.git\\' } | Select-Object -First 1
          if (-not $main) {
            $zip = Get-ChildItem -Path $root -Filter *.zip -Recurse -File |
                   Where-Object { $_.FullName -notmatch '\\\.git\\' } | Select-Object -First 1
            if (-not $zip) {
              Write-Error "В репозитории не найдено ни архива .zip, ни файла main.py. Загрузите SysPulse.zip и сделайте Commit changes."
              exit 1
            }
            Write-Output "Найден архив: $($zip.FullName)"
            $dest = Join-Path $env:RUNNER_TEMP 'src'
            Expand-Archive -LiteralPath $zip.FullName -DestinationPath $dest -Force
            $main = Get-ChildItem -Path $dest -Filter main.py -Recurse -File | Select-Object -First 1
            if (-not $main) { Write-Error "В архиве $($zip.Name) нет main.py"; exit 1 }
          }
          $src = $main.DirectoryName
          Write-Output "Исходники: $src"
          "SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        working-directory: ${{ env.SRC }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Линтер (ruff)
        working-directory: ${{ env.SRC }}
        continue-on-error: true
        run: ruff check .

      - name: Тесты
        working-directory: ${{ env.SRC }}
        continue-on-error: true
        run: python -m pytest -v

      - name: Сборка SysPulse.exe
        working-directory: ${{ env.SRC }}
        run: pyinstaller --noconfirm --clean SysPulse.spec

      - name: Публикация exe (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: SysPulse-windows
          path: ${{ env.SRC }}/dist/SysPulse.exe
          if-no-files-found: error

      - name: Проверка запуска exe
        working-directory: ${{ env.SRC }}
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\SysPulse.exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { Write-Error "SysPulse.exe завершился с кодом $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Output "exe запускается и работает"

      - name: Релиз (при создании тега v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.SRC }}/dist/SysPulse.exe
